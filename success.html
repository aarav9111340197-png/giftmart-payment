<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | GiftMart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">
    <div style="background: white; max-width: 500px; width: 100%; border-radius: 1.5rem; box-shadow: var(--shadow-lg); padding: 3rem; text-align: center;">
        <div style="width: 80px; height: 80px; background: #dcfce7; color: #16a34a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 2rem;">
            <i class="fa-solid fa-check"></i>
        </div>
        <h1 style="margin-bottom: 1rem; color: var(--text-heading);">Payment Successful!</h1>
        <p style="color: var(--text-body); margin-bottom: 2.5rem;">Your transaction has been processed successfully. Your gift card code will be sent to your email within 60 seconds.</p>
        
        <div style="background: #f1f5f9; padding: 1.5rem; border-radius: 1rem; margin-bottom: 2.5rem; text-align: left;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
                <span style="color: var(--text-muted); font-size: 0.9rem;">Payment ID:</span>
                <span id="payment-id" style="font-weight: 600; font-family: monospace;">-</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem;">
                <span style="color: var(--text-muted); font-size: 0.9rem;">Amount Paid:</span>
                <span id="amount-paid" style="font-weight: 600;">-</span>
            </div>
            <div style="display: flex; justify-content: space-between;">
                <span style="color: var(--text-muted); font-size: 0.9rem;">Item:</span>
                <span id="item-name" style="font-weight: 600;">-</span>
            </div>
        </div>

        <a href="index.html" class="btn btn-primary" style="width: 100%;">Back to Home</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('payment-id').innerText = urlParams.get('payment_id') || 'N/A';
        document.getElementById('amount-paid').innerText = '₹' + (urlParams.get('amount') || '0');
        document.getElementById('item-name').innerText = decodeURIComponent(urlParams.get('item') || 'Gift Card');
    </script>
</body>
</html>
