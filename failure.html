<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed | GiftMart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">
    <div style="background: white; max-width: 500px; width: 100%; border-radius: 1.5rem; box-shadow: var(--shadow-lg); padding: 3rem; text-align: center;">
        <div style="width: 80px; height: 80px; background: #fee2e2; color: #dc2626; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 2rem;">
            <i class="fa-solid fa-xmark"></i>
        </div>
        <h1 style="margin-bottom: 1rem; color: var(--text-heading);">Payment Failed</h1>
        <p style="color: var(--text-body); margin-bottom: 2rem;">Unfortunately, your transaction could not be completed. No amount was deducted from your account.</p>
        
        <div style="background: #fff1f2; border: 1px solid #fecdd3; padding: 1rem; border-radius: 0.5rem; margin-bottom: 2.5rem;">
            <p id="error-desc" style="font-size: 0.9rem; color: #be123c; font-weight: 500;">Reason: Unknown error occurred.</p>
        </div>

        <div style="display: flex; gap: 1rem;">
            <a href="index.html" class="btn btn-outline" style="flex: 1;">Back to Home</a>
            <button onclick="window.history.back()" class="btn btn-primary" style="flex: 1;">Try Again</button>
        </div>
        
        <p style="margin-top: 2rem; font-size: 0.85rem; color: var(--text-muted);">Need help? <a href="contact.html" style="color: var(--primary); font-weight: 600;">Contact Support</a></p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            document.getElementById('error-desc').innerText = 'Reason: ' + decodeURIComponent(error);
        }
    </script>
</body>
</html>
